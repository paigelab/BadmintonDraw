name: Check school announcement pages

on:
  schedule:
    # 00:00 and 12:00 UTC = 08:00 and 20:00 in Taiwan (UTC+8)
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_announcements.py
      - name: Commit changed monitoring status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-status.json
          git diff --cached --quiet || git commit -m "chore: update source monitoring status"
          git push
