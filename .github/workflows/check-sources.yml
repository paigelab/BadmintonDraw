name: Check school announcement pages

on:
  push:
    branches: [main]
    paths:
      - "data/sources.csv"
      - "scripts/check_announcements.py"
  schedule:
    # 02:08 and 10:08 UTC = 10:08 and 18:08 in Taiwan (UTC+8)
    - cron: "8 2,10 * * *"
  workflow_dispatch:
    inputs:
      send_test_discord_notification:
        description: "Send one Discord test notification without changing notification records"
        required: false
        default: false
        type: boolean
      send_test_discord_error_notification:
        description: "Send one Discord source-error test notification without changing notification records"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

# A crawler run commits generated JSON back to main. Serialize runs to avoid
# push races, but do not cancel a user-requested/manual check once it starts.
concurrency:
  group: check-school-announcements
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The push event can contain more than one commit; inspect all of it
          # before deciding whether this is a source-only update.
          fetch-depth: 0
      - name: Choose crawl scope
        id: crawl-scope
        shell: bash
        run: |
          scope=all
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
            if [ "$changed_files" = "data/sources.csv" ]; then
              scope=changed
            fi
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Crawler scope: $scope"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_announcements.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ERROR_WEBHOOK_URL: ${{ secrets.DISCORD_ERROR_WEBHOOK_URL }}
          DISCORD_TEST_NOTIFICATION: ${{ inputs.send_test_discord_notification || 'false' }}
          DISCORD_ERROR_TEST_NOTIFICATION: ${{ inputs.send_test_discord_error_notification || 'false' }}
          CRAWL_SCOPE: ${{ steps.crawl-scope.outputs.scope }}
      - name: Commit changed monitoring status
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-status.json data/announcements.json data/notified.json
          git diff --cached --quiet || git commit -m "chore: update source monitoring status"
          git push
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy-updated-data:
    needs: check
    runs-on: ubuntu-latest
    # Use the same deployment queue as pages.yml. A crawler update pushes data
    # while the normal Pages workflow is also triggered, so only the newest
    # deployment should be allowed to continue.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy the exact commit created by the preceding monitoring job.
          ref: ${{ needs.check.outputs.commit_sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
