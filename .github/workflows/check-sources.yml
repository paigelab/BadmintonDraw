name: Check school announcement pages

on:
  push:
    branches: [main]
    paths:
      - "data/sources.csv"
      - "scripts/check_announcements.py"
  schedule:
    # 02:08 and 10:08 UTC = 10:08 and 18:08 in Taiwan (UTC+8)
    - cron: "8 2,10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_announcements.py
      - name: Commit changed monitoring status
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-status.json data/announcements.json
          git diff --cached --quiet || git commit -m "chore: update source monitoring status"
          git push
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy-updated-data:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy the exact commit created by the preceding monitoring job.
          ref: ${{ needs.check.outputs.commit_sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
