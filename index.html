<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="各校羽球場地抽籤與登記公告整理" />
    <title>羽球場地抽籤資訊站</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <p class="eyebrow">BADMINTON DRAW</p>
      <h1>羽球場地抽籤資訊站</h1>
      <p>集中追蹤各校公開的場地抽籤、登記與使用公告。</p>
    </header>

    <main>
      <section class="notice" aria-label="資料說明">
        <strong>近期羽球場地資訊</strong>
        <span>公告資料來自各校公開網站；請以校方原始公告為準。</span>
      </section>

      <section aria-labelledby="announcements-title">
        <div class="section-heading">
          <div><p class="eyebrow">LATEST</p><h2 id="announcements-title">最新公告</h2></div>
          <p id="result-count" aria-live="polite"></p>
        </div>
        <p class="section-note">僅顯示近一個月內的登記／報名與抽籤結果公告。</p>
        <div id="announcement-list" class="announcement-list"></div>
      </section>

      <section id="history" class="history" aria-labelledby="history-title">
        <details id="history-details">
          <summary><span><p class="eyebrow">ARCHIVE</p><h2 id="history-title">歷史資料</h2></span><span class="summary-hint">展開查詢</span></summary>
          <div class="history-content">
            <div class="history-controls" aria-label="歷史公告篩選">
              <label>關鍵字搜尋<input id="search" type="search" placeholder="例如：抽籤、羽球、場地" /></label>
              <label>學校<select id="school-filter"><option value="">全部學校</option></select></label>
              <label>公告類型<select id="category-filter"><option value="">全部類型</option></select></label>
            </div>
            <p id="history-count" class="history-count" aria-live="polite"></p>
            <div id="history-list" class="announcement-list"></div>
          </div>
        </details>
      </section>

      <section class="monitoring" aria-labelledby="monitoring-title">
        <details id="monitoring-details">
          <summary><span><p class="eyebrow">MONITORING</p><h2 id="monitoring-title">正在監測的學校</h2></span><span id="monitoring-count" class="summary-hint">展開查看</span></summary>
          <div class="monitoring-content">
            <div id="source-list" class="source-list"></div>
          </div>
        </details>
      </section>

      <section class="manual-check" aria-labelledby="manual-check-title">
        <div class="section-heading">
          <div><p class="eyebrow">MANUAL CHECK</p><h2 id="manual-check-title">人工檢查</h2></div>
        </div>
        <p class="section-note">以下公告頁目前不納入排程掃描，請直接前往校方網站確認。</p>
        <div id="manual-check-list" class="source-list"></div>
      </section>
    </main>

    <footer>資料來自各校公開網站・最後資料更新：<span id="last-updated">—</span></footer>
    <script src="app.js"></script>
  </body>
</html>
